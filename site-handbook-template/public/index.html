<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Site Handbook</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mermaid/10.9.1/mermaid.min.js"></script>
<style>
:root{--ink:#1C2B39;--paper:#F4F5F0;--card:#fff;--line:#D8DCD2;--hl:#FFE45C;--blue:#1F4FD8;--dim:#4A5C6E}
*{box-sizing:border-box;margin:0}
body{font-family:Georgia,serif;background:var(--paper);color:var(--ink);font-size:16.5px;line-height:1.6}
.shell{display:flex;min-height:100vh}
.side{width:250px;flex-shrink:0;background:var(--ink);color:#E7EDF2;padding:22px 0;position:sticky;top:0;height:100vh}
.side h1{font-size:17px;padding:0 20px 14px;border-bottom:1px solid rgba(255,255,255,.15)}
.side h1 small{display:block;font-family:monospace;font-size:10px;letter-spacing:.12em;color:#8FA6BC;margin-top:4px;text-transform:uppercase}
.side a{display:block;padding:9px 20px;color:#CBD8E3;text-decoration:none;font-size:14px;border-left:3px solid transparent}
.side a:hover{background:rgba(255,255,255,.07);color:#fff}
.side a.on{border-left-color:var(--hl);background:rgba(255,255,255,.09);color:#fff}
main{flex:1;min-width:0}
.page{max-width:740px;margin:0 auto;padding:44px 28px 90px}
h1{font-size:30px;line-height:1.15;margin:0 0 6px;border-bottom:4px solid var(--hl);padding-bottom:8px}
h2{font-size:21px;margin:34px 0 10px}
h3{font-size:17px;margin:24px 0 8px}
p{margin:0 0 13px}
ul,ol{margin:0 0 13px 22px}
li{margin-bottom:6px}
a{color:var(--blue)}
code{font-family:monospace;font-size:.85em;background:#E8EAE2;padding:2px 5px;border-radius:4px;color:#173C9F}
pre{background:#141B24;color:#D7E4CE;padding:14px 16px;border-radius:8px;overflow-x:auto;font-size:13.5px;line-height:1.55;margin:0 0 16px}
pre code{background:none;color:inherit;padding:0}
table{width:100%;border-collapse:collapse;margin:0 0 16px;font-size:14.5px;background:var(--card)}
th{background:var(--ink);color:#fff;text-align:left;padding:8px 11px;font-size:13.5px}
td{padding:8px 11px;border-bottom:1px solid var(--line);vertical-align:top}
blockquote{border-left:4px solid var(--hl);padding:4px 0 4px 16px;margin:0 0 14px;color:var(--dim);font-style:italic}
.verified{font-family:monospace;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:#8A6D10;background:#FFFBEA;border:1px solid #E8D98A;display:inline-block;padding:4px 10px;border-radius:20px;margin:0 0 20px}
.mermaid{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:16px;margin:0 0 16px;display:flex;justify-content:center}
.menu-btn{display:none}
@media(max-width:860px){
 .side{position:fixed;left:0;top:0;z-index:40;transform:translateX(-100%);transition:transform .2s}
 .side.open{transform:none;box-shadow:4px 0 20px rgba(0,0,0,.4)}
 .menu-btn{display:block;position:fixed;top:12px;left:12px;z-index:50;background:var(--ink);color:#fff;border:0;border-radius:6px;padding:9px 13px;font-family:monospace;font-size:12px}
 .page{padding-top:64px}
}
</style>
</head>
<body>
<button class="menu-btn" id="mb">☰ Pages</button>
<div class="shell">
<nav class="side" id="side">
  <h1>Site Handbook<small>[Project Name] · replace me</small></h1>
  <div id="nav"></div>
</nav>
<main><div class="page" id="out">Loading…</div></main>
</div>
<script>
const PAGES = [
  ['overview',   '1. Site Overview'],
  ['accounts',   '2. Accounts &amp; Tools'],
  ['client-guide','3. Client Guide'],
  ['dev-guide',  '4. Dev Guide'],
  ['data-map',   '5. Data Map &amp; Retention'],
  ['incidents',  '6. Incident Recipes'],
  ['watchlist',  '7. Free-Tier Watchlist'],
];
mermaid.initialize({startOnLoad:false, theme:'neutral'});
const nav = document.getElementById('nav'), out = document.getElementById('out');
nav.innerHTML = PAGES.map(([id,t])=>`<a href="#${id}" data-p="${id}">${t}</a>`).join('');

async function load(){
  let id = (location.hash||'#overview').slice(1);
  if(!PAGES.some(p=>p[0]===id)) id='overview';
  document.querySelectorAll('#nav a').forEach(a=>a.classList.toggle('on',a.dataset.p===id));
  try{
    const md = await (await fetch(`content/${id}.md`)).text();
    // style the "Last verified" convention line
    const styled = md.replace(/^_Last verified: (.*?)_$/m, '<span class="verified">Last verified: $1</span>');
    out.innerHTML = marked.parse(styled);
    // render fenced mermaid blocks
    for(const block of out.querySelectorAll('code.language-mermaid')){
      const pre = block.parentElement;
      const {svg} = await mermaid.render('m'+Math.random().toString(36).slice(2,8), block.textContent);
      const div = document.createElement('div'); div.className='mermaid'; div.innerHTML = svg;
      pre.replaceWith(div);
    }
  }catch(e){ out.innerHTML = '<p>Could not load page. Are you serving over http? (See README — <code>file://</code> won\'t work.)</p>'; }
  window.scrollTo(0,0);
  document.getElementById('side').classList.remove('open');
}
window.addEventListener('hashchange', load);
document.getElementById('mb').onclick = ()=>document.getElementById('side').classList.toggle('open');
load();
</script>
</body>
</html>
